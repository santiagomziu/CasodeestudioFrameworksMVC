<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Estudiante - RollerSpeed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

<!-- Navegación reutilizando fragmento -->
<div th:replace="~{fragments :: nav}"></div>

<main class="container my-5" style="max-width: 600px;">
    <div class="card shadow-sm p-4 bg-white rounded">
        <h2 class="mb-4 text-primary fw-bold">Editar Estudiante</h2>

        <form th:action="@{/trainees/update/{id}(id=${trainee.id})}" th:object="${trainee}" method="post">

            <div class="mb-3">
                <label for="name" class="form-label">Nombre:</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="lastName" class="form-label">Apellido:</label>
                <input type="text" id="lastName" th:field="*{lastName}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico:</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="phoneNumber" class="form-label">Teléfono:</label>
                <input type="text" id="phoneNumber" th:field="*{phoneNumber}" class="form-control">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" id="isActive" th:field="*{active}" class="form-check-input">
                <label for="isActive" class="form-check-label">Estudiante Activo</label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Guardar Cambios</button>
            <a th:href="@{/trainees}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
        </form>
    </div>


</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Reemplaza con el fragmento del Footer -->
<footer th:replace="~{fragments :: footer}"></footer>

</body>
</html>
