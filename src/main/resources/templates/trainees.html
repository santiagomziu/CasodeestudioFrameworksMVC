<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudiantes - RollerSpeed</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos CSS personalizados -->
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<!-- Navegación reutilizando fragmento -->
<div th:replace="~{fragments :: nav}"></div>

<main class="container my-5 pt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-primary">Listado de Estudiantes</h2>
    <a th:href="@{/registro}" class="btn btn-success">+ Registrar Nuevo Estudiante</a>
  </div>

  <!-- Tabla de Estudiantes -->
  <div class="table-responsive shadow-sm rounded">
    <table class="table table-hover align-middle mb-0 bg-white">
      <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Correo Electrónico</th>
        <th>Teléfono</th>
        <th>Estado</th>
        <th class="text-center">Acciones</th>
      </tr>
      </thead>
      <tbody>
      <!-- Iteración sobre la lista de estudiantes -->
      <tr th:each="trainees : ${trainees}">
        <td th:text="${trainees.id}">1</td>
        <td th:text="${trainees.name}">Nombre</td>
        <td th:text="${trainees.lastName}">Apellido</td>
        <td th:text="${trainees.email}">correo@example.com</td>
        <td th:text="${trainees.phoneNumber ?: 'N/A'}">3001234567</td>
        <td>
          <span th:if="${trainees.isActive}" class="badge bg-success">Activo</span>
          <span th:unless="${trainees.isActive}" class="badge bg-danger">Inactivo</span>
        </td>
        <td class="text-center">
          <a th:href="@{/trainees/edit/{id}(id=${trainees.id})}" class="btn btn-sm btn-outline-primary me-1">Editar</a>
          <a th:href="@{/trainees/delete/{id}(id=${trainees.id})}" class="btn btn-sm btn-outline-danger"
             onclick="return confirm('¿Está seguro de eliminar este estudiante?')">Eliminar</a>
        </td>
      </tr>

      <!-- Mensaje si la lista está vacía -->
      <tr th:if="${#lists.isEmpty(trainees)}">
        <td colspan="7" class="text-center py-4 text-muted">
          No hay estudiantes registrados actualmente.
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</main>

<!-- Pie de página reutilizando fragmento -->
<div th:replace="~{fragments :: footer}"></div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
